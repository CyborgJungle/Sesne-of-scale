<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sense of Scale</title>
<meta name="description" content="A daily game about how big, fast, hot, loud and old things really are. Place five things on a scale, three scales a day.">
<meta name="theme-color" content="#E6ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E181D" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Sense of Scale">
<meta property="og:description" content="Daily puzzle: put five things on a scale. How good is your sense of scale?">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1><a href="/" id="home-link">Sense of Scale</a></h1><span class="tickmark">|||||||||</span></div>
    <div class="meter" id="meter" hidden>
      <div><span id="m-label">Puzzle</span><b id="m-num">#1</b></div>
      <div><span>Scale</span><b id="m-round">1 / 3</b></div>
      <div><span>Score</span><b id="m-score">0</b></div>
    </div>
    <nav class="nav" id="nav">
      <button class="linkbtn" data-nav="home">Today</button>
      <button class="linkbtn" data-nav="archive">Archive</button>
    </nav>
  </header>
  <main id="main"><p class="tray-note">Loading today's puzzle…</p></main>
</div>
<noscript>Sense of Scale needs JavaScript.</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
